<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Work</title>
  <meta name="description" content="Premium video and photography production portfolio." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>
  <div class="side-line side-line-left"></div>
  <div class="side-line side-line-right"></div>

  <main>
    <section class="hero">
      <p class="label">Portfolio</p>
      <h1>My Work</h1>
      <div class="scroll-line"><span></span></div>
    </section>

    <section class="videos" aria-label="Portfolio videos">
      <!-- VIDEO 1 -->
      <article class="video-card">
        <div class="video-wrap">
          <video controls playsinline preload="metadata">
            <source src="videos/video-1.mp4" type="video/mp4" />
          </video>
        </div>
      </article>

      <!-- VIDEO 2 -->
      <article class="video-card">
        <div class="video-wrap">
          <video controls playsinline preload="metadata">
            <source src="videos/video-2.mp4" type="video/mp4" />
          </video>
        </div>
      </article>

      <!-- VIDEO 3 -->
      <article class="video-card">
        <div class="video-wrap">
          <video controls playsinline preload="metadata">
            <source src="videos/video-3.mp4" type="video/mp4" />
          </video>
        </div>
      </article>
    </section>

    <footer class="contact">
      <div>
        <p class="label">Available for selected projects</p>
        <h2>Contact</h2>
      </div>

      <div class="links">
        <a href="mailto:ietkaozcan@gmail.com">ietkaozcan@gmail.com</a>
        <a href="https://www.instagram.com/etkaozcn" target="_blank" rel="noopener">Instagram</a>
      </div>
    </footer>
  </main>
</body>
</html>
